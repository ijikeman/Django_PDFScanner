<!DOCTYPE html>
<html>
<head>
    <title>Upload Document</title>
</head>
<body>
    <h1>決算短信アップローダー</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.name.as_p }}
    {{ form.file.as_p }}
    {{ form.page_numbers.as_p }}
    <button type="submit">アップロード</button>
</form>
</body>
</html>
